<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ATLAS Course Assistant — AI teaching assistant for course-specific learning.">
<title>ATLAS — Course Assistant</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#2c2c2c;background:#f8f7f5}button,textarea{font:inherit}[hidden]{display:none!important}.app{display:flex;height:100vh}.sidebar{width:280px;background:#fff;border-right:1px solid #e0ddd5;display:flex;flex-direction:column}.side-head,.side-foot{padding:16px}.side-head{border-bottom:1px solid #e0ddd5}.side-foot{border-top:1px solid #e0ddd5;font-size:11px;color:#6b6b6b}.side-title{font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}.progress{height:6px;background:#e0ddd5;border-radius:4px;overflow:hidden}.progress>div{height:100%;background:#4caf50}.progress-text{font-size:11px;color:#6b6b6b;margin-top:7px}.concepts{flex:1;overflow:auto}.concept{padding:11px 16px;border-bottom:1px solid #f0f0f0;border-left:3px solid transparent;display:flex;gap:10px;cursor:pointer}.concept:hover{background:#f8f7f5;border-left-color:#c00}.dot{width:10px;height:10px;border-radius:50%;background:#ccc;margin-top:5px;flex:0 0 auto}.dot.covered{background:#4a90d9}.dot.explored{background:#4caf50}.concept-name{font-size:13px;font-weight:550}.concept-lectures{font-size:10px;color:#777}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{background:#fff;border-bottom:1px solid #e0ddd5;padding:15px 24px;display:flex;align-items:center;gap:20px}.brand{font-size:20px;font-weight:750;color:#c00;white-space:nowrap}.brand small{font-size:10px;font-weight:400;color:#999;margin-left:5px}.course-head{flex:1;text-align:center;min-width:0}.course-code{font-size:12px;color:#6b6b6b;letter-spacing:.05em;text-transform:uppercase}.course-name{font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.about{color:#c00;text-decoration:none;font-size:13px}.menu{display:none;border:0;background:transparent;color:#c00;font-size:20px}.chat{flex:1;min-height:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:22px 24px 18px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}.message{display:flex}.message.user{justify-content:flex-end}.bubble{max-width:min(780px,76%);display:flex;flex-direction:column;align-items:flex-start}.user .bubble{align-items:flex-end}.content{width:fit-content;max-width:100%;padding:12px 16px;background:#fff;border:1px solid #e0ddd5;border-radius:9px;font-size:14px;line-height:1.6;overflow-wrap:anywhere}.user .content{background:#c00;border-color:#c00;color:#fff}.content p{margin:8px 0}.content p:first-child{margin-top:0}.content p:last-child{margin-bottom:0}.content h3,.content h4{margin:12px 0 6px}.content h3{font-size:15px}.content h4{font-size:14px}.content ul{padding-left:20px}.content code{background:#eee;padding:2px 5px;border-radius:4px}.user .content code{color:#222}.sources{width:100%;margin-top:5px;font-size:12px}.sources summary{display:inline-block;cursor:pointer;color:#666;font-weight:600;padding:3px 6px;border-radius:5px}.sources summary:hover{background:#ece9e4}.sources summary::before{content:"▸ ";color:#8f430d}.sources[open] summary::before{content:"▾ "}.source-body{margin-top:5px;padding:10px 12px;background:#fffaf2;border:1px solid #ead8bd;border-radius:8px}.source-item+.source-item{border-top:1px solid #ead8bd;margin-top:8px;padding-top:8px}.source-name{font-weight:650}.source-excerpt{color:#62594d}.actions{width:100%;display:flex;align-items:center;gap:2px;flex-wrap:wrap;min-height:28px;margin-top:4px}.feedback,.right-actions{display:flex;align-items:center;gap:2px;flex-wrap:wrap}.right-actions{margin-left:auto}.act{border:0;background:transparent;color:#666;cursor:pointer;border-radius:6px;padding:4px 7px;font-size:12px}.act:hover:not(:disabled){background:#ece9e4;color:#222}.act:disabled{cursor:default;opacity:.65}.feedback .act{font-size:14px}.understood{color:#357a38}.project,.research,.save{color:#8f430d;font-weight:650}.feedback-note{font-size:11px;color:#777}.feedback-box{width:min(360px,100%);margin-top:5px;padding:8px 10px;border:1px solid #ddd;border-radius:6px}.typing{padding:12px 16px;color:#aaa}.status{background:#fff;padding:6px 20px 0;display:flex;justify-content:flex-end;align-items:center;gap:6px;font-size:12px}.pill{background:#fffaf2;border:1px solid #ead8bd;color:#6b4c31;border-radius:999px;padding:3px 8px}.exit{border:0;background:transparent;color:#8f430d;cursor:pointer;padding:3px 5px;border-radius:5px}.exit:hover{background:#ece9e4}.input-area{background:#fff;border-top:1px solid #e0ddd5;padding:10px 20px 16px}.status:not([hidden])+.input-area{border-top:0;padding-top:7px}.input-row{display:flex;gap:12px;align-items:flex-end}.input{flex:1;min-height:44px;max-height:120px;resize:none;border:1px solid #ddd;border-radius:8px;padding:11px 14px;font-size:14px}.input:focus{outline:0;border-color:#c00;box-shadow:0 0 0 3px rgba(204,0,0,.1)}.send{height:44px;border:0;border-radius:8px;background:#c00;color:#fff;font-weight:650;padding:0 20px;cursor:pointer}.send:hover{background:#a00}.welcome{text-align:center;color:#666;padding:38px 20px}.welcome-icon{font-size:42px}.welcome-title{font-size:18px;font-weight:650;color:#2c2c2c;margin-top:8px}@media(max-width:900px){.sidebar{position:absolute;z-index:10;height:100%;display:none;box-shadow:2px 0 8px #0002}.sidebar.open{display:flex}.menu{display:block}.bubble{max-width:86%}}@media(max-width:680px){.top{padding:12px 16px;flex-wrap:wrap}.brand small{display:none}.course-head{order:3;flex-basis:100%}.messages{padding:16px}.bubble{max-width:95%}.right-actions{margin-left:0}.input-area{padding:8px 12px 12px}.status{padding:5px 12px 0}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
<div class="side-head"><div class="side-title">Course Concept Map</div><div class="progress"><div id="progress-fill" style="width:0"></div></div><div class="progress-text"><span id="progress-count">0</span> of <span id="progress-total">0</span> concepts explored</div></div>
<div class="concepts" id="concepts"></div><div class="side-foot" id="side-foot">Loading concepts...</div>
</aside>
<main class="main">
<header class="top"><div class="brand">ATLAS <small>Adaptive Teaching &amp; Learning Assistant System</small></div><div class="course-head"><div class="course-code" id="course-code">Loading...</div><div class="course-name" id="course-name">Loading...</div></div><a class="about" href="/about">About</a><button class="menu" id="menu" type="button">☰</button></header>
<section class="chat"><div class="messages" id="messages"><div class="welcome" id="welcome"><div class="welcome-icon">📚</div><div class="welcome-title" id="welcome-title">Welcome!</div><p>Ask me anything about this course. I'm familiar with the lecture content and can help you understand key concepts.</p></div></div>
<div class="status" id="guide-status" hidden><span class="pill" id="guide-name"></span><button class="exit" id="guide-exit" type="button">Return to course chat</button></div>
<div class="input-area"><div class="input-row"><textarea class="input" id="input" rows="1" placeholder="Ask about this course..."></textarea><button class="send" id="send" type="button">Send</button></div></div></section>
</main></div>
<script>
function esc(s){var d=document.createElement('div');d.textContent=String(s);return d.innerHTML}
function md(t){var h=esc(t);h=h.replace(/^### (.+)$/gm,'<h4>$1</h4>').replace(/^## (.+)$/gm,'<h3>$1</h3>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g,'<ul>$&</ul>').replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');return '<p>'+h+'</p>'}
var courseId=location.pathname.split('/').pop(),sessionId,currentCourse=null,conceptMap=null,messageHistory=[],answerMode='socratic',guideMode='course_chat';
function uuid(){return'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function init(){sessionId=sessionStorage.getItem('atlas_session_id')||uuid();sessionStorage.setItem('atlas_session_id',sessionId);loadCourse();loadConcepts()}
async function loadCourse(){try{var r=await fetch('/course/'+encodeURIComponent(courseId)+'/metadata',{cache:'no-store'});if(!r.ok)throw Error();currentCourse=await r.json();document.getElementById('course-code').textContent=currentCourse.code;document.getElementById('course-name').textContent=currentCourse.name;document.getElementById('welcome-title').textContent='Welcome to '+currentCourse.code;document.getElementById('input').placeholder='Ask about '+currentCourse.code+'...'}catch(e){console.error(e)}}
async function loadConcepts(){try{var r=await fetch('/course/'+courseId+'/concept-map');conceptMap=await r.json();renderConcepts()}catch(e){document.getElementById('side-foot').textContent='Error loading concepts'}}
function renderConcepts(){var list=document.getElementById('concepts');list.innerHTML='';if(!conceptMap||!conceptMap.concepts||!conceptMap.concepts.length){document.getElementById('side-foot').textContent='No concept map has been added yet.';return}var done=JSON.parse(localStorage.getItem('atlas_progress_'+courseId)||'{}'),n=0;conceptMap.concepts.forEach(function(c){if(done[c.id])n++;var row=document.createElement('div');row.className='concept';var dot=document.createElement('span');dot.className='dot '+(done[c.id]?'explored':(c.lectures&&c.lectures.length?'covered':''));var box=document.createElement('div');box.innerHTML='<div class="concept-name">'+esc(c.name)+'</div><div class="concept-lectures">'+(c.lectures?'L'+c.lectures.join(', L'):'')+'</div>';row.append(dot,box);row.onclick=function(){sendMessage('Tell me about '+c.name+' and what I need to know before studying it.')};list.appendChild(row)});document.getElementById('progress-count').textContent=n;document.getElementById('progress-total').textContent=conceptMap.concepts.length;document.getElementById('progress-fill').style.width=(100*n/conceptMap.concepts.length)+'%';document.getElementById('side-foot').textContent='Select a concept to explore it with ATLAS.'}
async function sendMessage(text){if(!text.trim())return;var mode=guideMode,input=document.getElementById('input');input.value='';input.style.height='auto';addMessage('user',text);var typing=addTyping();try{var r=await fetch('/course/'+courseId+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_id:courseId,session_id:sessionId,message:mode==='course_chat'&&answerMode==='socratic'?'[SOCRATIC MODE] '+text:text,history:messageHistory.slice(-12),mode:mode})});var d=await r.json();if(!r.ok)throw Error(d.detail||'The course assistant could not complete that request.');typing.remove();addMessage('assistant',d.response,d.sources||[],mode);messageHistory.push({role:'user',content:text},{role:'assistant',content:d.response})}catch(e){typing.remove();addMessage('assistant',e.message||'The course assistant encountered an error.',[],mode)}}
function button(text,cls,label){var b=document.createElement('button');b.type='button';b.className='act '+(cls||'');b.textContent=text;if(label)b.setAttribute('aria-label',label);return b}
function addMessage(role,text,sources,responseMode){var msgs=document.getElementById('messages'),welcome=document.getElementById('welcome');if(welcome&&role==='user')welcome.remove();var msg=document.createElement('div');msg.className='message '+role;var bubble=document.createElement('div');bubble.className='bubble';var content=document.createElement('div');content.className='content';content.innerHTML=role==='user'?esc(text):md(text);bubble.appendChild(content);if(role==='assistant'){appendSources(bubble,sources||[]);if(responseMode==='mode_notice'){var a=document.createElement('div');a.className='actions';var right=document.createElement('div');right.className='right-actions';var mt=button('','mode-toggle');mt.onclick=toggleMode;right.appendChild(mt);a.appendChild(right);bubble.appendChild(a)}else if(responseMode!=='guide_intro'){var a=document.createElement('div');a.className='actions';var fb=document.createElement('div');fb.className='feedback';var up=button('👍','', 'Helpful'),down=button('👎','', 'Not helpful');up.onclick=function(){feedback(text,'up',fb)};down.onclick=function(){feedback(text,'down',fb,true)};fb.append(up,down);a.appendChild(fb);var right=document.createElement('div');right.className='right-actions';var understood=button('✓ Understood','understood');understood.onclick=function(){markUnderstood();understood.textContent='Understood ✓';understood.disabled=true};right.appendChild(understood);if(responseMode==='course_chat'){if(currentCourse&&currentCourse.project_builder_enabled){var p=button('Turn this into a project','project');p.onclick=function(){startGuide('project_builder')};right.appendChild(p)}if(currentCourse&&currentCourse.research_innovation_enabled){var q=button('Research direction','research');q.onclick=function(){startGuide('research_innovation')};right.appendChild(q)}var mt=button('','mode-toggle');mt.onclick=toggleMode;right.appendChild(mt)}var projectBrief=responseMode==='project_builder'&&/(^|\n)## Project Brief\b/.test(text),researchBrief=responseMode==='research_innovation'&&/(^|\n)## Research Direction Brief\b/.test(text);if(projectBrief||researchBrief){var save=button(projectBrief?'Download project brief':'Download research brief','save');save.onclick=function(){downloadBrief(text,projectBrief?'project-brief':'research-direction-brief')};right.appendChild(save)}a.appendChild(right);bubble.appendChild(a)}}msg.appendChild(bubble);msgs.appendChild(msg);refreshModeButtons();if(role==='assistant')requestAnimationFrame(function(){msgs.scrollTo({top:Math.max(0,msg.offsetTop-10),behavior:'smooth'})});else msgs.scrollTop=msgs.scrollHeight}
function appendSources(bubble,sources){if(!sources.length)return;var d=document.createElement('details');d.className='sources';var s=document.createElement('summary');s.textContent=sources.length===1?'Course source (1)':'Course sources ('+sources.length+')';var body=document.createElement('div');body.className='source-body';sources.forEach(function(x){var item=document.createElement('div');item.className='source-item';item.innerHTML='<div class="source-name">'+esc(x.name)+'</div><div class="source-excerpt">&quot;'+esc(x.excerpt)+'&quot;</div>';body.appendChild(item)});d.append(s,body);bubble.appendChild(d)}
function toggleMode(){answerMode=answerMode==='socratic'?'direct':'socratic';refreshModeButtons()}
function refreshModeButtons(){document.querySelectorAll('.mode-toggle').forEach(function(b){b.textContent=answerMode==='socratic'?'Direct answers':'Socratic questions';b.title=answerMode==='socratic'?'Switch to direct responses':'Switch to Socratic questions'})}
function startGuide(mode){if(!currentCourse)return;if(mode==='project_builder'&&!currentCourse.project_builder_enabled)return;if(mode==='research_innovation'&&!currentCourse.research_innovation_enabled)return;guideMode=mode;var prompt=mode==='project_builder'?'Let’s turn the discussion above into a project. First question: would you rather build something, analyze or compare something, or have ATLAS suggest a few possibilities?':'Let’s develop a possible research direction from the discussion above. First question: which idea or limitation in the discussion seems most worth investigating?';addMessage('assistant',prompt,[],'guide_intro');messageHistory.push({role:'assistant',content:prompt});document.getElementById('guide-name').textContent=mode==='project_builder'?'Project Builder':'Research and Innovation Guide';document.getElementById('guide-status').hidden=false;document.getElementById('input').placeholder=mode==='project_builder'?'Answer the project question...':'Answer the research question...';document.getElementById('input').focus()}
function exitGuide(){guideMode='course_chat';document.getElementById('guide-status').hidden=true;if(currentCourse)document.getElementById('input').placeholder='Ask about '+currentCourse.code+'...';var note=answerMode==='socratic'?'You are back in course chat. Socratic questions are on. Use “Direct answers” below to switch.':'You are back in course chat. Direct answers are on.';addMessage('assistant',note,[],'mode_notice');messageHistory.push({role:'assistant',content:note})}
function feedback(response,rating,box,showBox){fetch('/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({course_id:courseId,session_id:sessionId,message:messageHistory.length>=2?messageHistory[messageHistory.length-2].content:'',response:response,rating:rating})}).catch(console.error);box.innerHTML='<span class="feedback-note">Thanks</span>';if(showBox){var t=document.createElement('textarea');t.className='feedback-box';t.rows=2;t.placeholder='What could be better?';box.closest('.bubble').appendChild(t)}}
function markUnderstood(){var done=JSON.parse(localStorage.getItem('atlas_progress_'+courseId)||'{}');if(conceptMap&&conceptMap.concepts&&conceptMap.concepts.length){done[conceptMap.concepts[0].id]=true;localStorage.setItem('atlas_progress_'+courseId,JSON.stringify(done));renderConcepts()}}
function downloadBrief(text,name){var u=URL.createObjectURL(new Blob([text+'\n'],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=name+'.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(u)}
function addTyping(){var m=document.createElement('div');m.className='message';m.innerHTML='<div class="typing">•••</div>';document.getElementById('messages').appendChild(m);document.getElementById('messages').scrollTop=document.getElementById('messages').scrollHeight;return m}
document.getElementById('send').onclick=function(){sendMessage(document.getElementById('input').value)};document.getElementById('guide-exit').onclick=exitGuide;document.getElementById('input').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(this.value)}});document.getElementById('input').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});document.getElementById('menu').onclick=function(){document.getElementById('sidebar').classList.toggle('open')};init();
</script>
</body>
</html>
